name: Build and Release .NET Desktop App

on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      solution: 'hakchi_gui.sln'
      # Добавил для теста. Удалить потом
      buildPlatform: 'x64'
      buildConfiguration: 'Release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        with:
          submodules: true

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Add NSIS to PATH
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.solution }}

      - name: Prepare GamesDB API Key File
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}\hakchi_gui\ApiKeys" -Force
          New-Item -ItemType File -Path "${{ github.workspace }}\hakchi_gui\ApiKeys\TheGamesDB.txt" -Force
          Set-Content -Path "${{ github.workspace }}\hakchi_gui\ApiKeys\TheGamesDB.txt" -Value $env:GamesDBApiKey -NoNewLine
        env:
          GamesDBApiKey: ${{ secrets.GAMESDB_API_KEY }}

      - name: Build Helper Tools
        run: |
          msbuild "NSI\nsi-helper\nsi-helper.csproj" /p:Configuration=Release
          msbuild "Zipper\Zipper.csproj" /p:Configuration=Release
        shell: pwsh

      - name: Build Main Application
        shell: pwsh
        run: |
          $env:SolutionDir = "${{ github.workspace }}\"
          msbuild "hakchi_gui.sln" /p:Configuration=Release /target:hakchi_gui

      - name: Generate Uninstall Script
        run: |
          $appPath = "${{ github.workspace }}\hakchi_gui\bin\Release\net8.0-windows"
          & "NSI\nsi-helper\bin\Release\net8.0\nsi-helper.exe" $appPath "NSI\release-uninstall.nsh"
        shell: pwsh

      - name: Build Installer via NSIS (Force x64)
        shell: pwsh
        run: |
          $env:HAKCHI_PATH = "${{ github.workspace }}\hakchi_gui\bin\Release\net8.0-windows"
          
          # Явно вызываем 64-битный компилятор NSIS
          $nsisX64 = "C:\Program Files (x86)\NSIS\makensis.exe"
          $process = Start-Process -FilePath $nsisX64 -ArgumentList "/V4", "${{ github.workspace }}\NSI\Installer.nsi" -NoNewWindow -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
            Write-Error "NSIS failed! Exit code: $($process.ExitCode)"
            exit $process.ExitCode
          }

      - name: Run Hakchi Version Script
        run: |
          $exePath = "${{ github.workspace }}\hakchi_gui\bin\Release\net8.0-windows\hakchi.exe"
          $versionPath = "${{ github.workspace }}\displayVersion.txt"
          
          Start-Process -FilePath $exePath -ArgumentList "--versionFormat", "{0}", "--versionFile", $versionPath -Wait -NoNewWindow
          
          if (Test-Path $versionPath) {
            $version = (Get-Content -Path $versionPath).Trim()
            Remove-Item -Path $versionPath
            Add-Content -Path $ENV:GITHUB_ENV -Value "displayVersion=$version"
          } else {
            Add-Content -Path $ENV:GITHUB_ENV -Value "displayVersion=0.0.0-unknown"
          }
        shell: pwsh

      - name: Create Portable ZIP
        run: |
          $source = "${{ github.workspace }}\hakchi_gui\bin\Release\net8.0-windows"
          $tempDir = "${{ github.workspace }}\temp_portable"
          $zipPath = "${{ github.workspace }}\hakchi3-${{ env.displayVersion }}-portable.zip"
          
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          Copy-Item -Path "$source\*" -Destination $tempDir -Recurse -Exclude *.pdb, *.xml
          Compress-Archive -Path "$tempDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Remove-Item -Path $tempDir -Recurse -Force
        shell: pwsh

      - name: Upload Artifacts (Portable)
        uses: actions/upload-artifact@v4
        with:
          name: hakchi3-${{ env.displayVersion }}-portable
          path: ${{ github.workspace }}\hakchi3-${{ env.displayVersion }}-portable.zip

      - name: Upload Artifacts (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: hakchi3-${{ env.displayVersion }}-installer
          # Берем файл ровно оттуда, куда его положил NSIS в логах
          path: ${{ github.workspace }}\hakchi_gui\bin\hakchi3-${{ env.displayVersion }}-installer.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Hakchi3 v${{ env.displayVersion }}
          tag_name: ${{ github.ref_name }}
          draft: false          
          prerelease: false
          generate_release_notes: true
          files: |
            hakchi_gui/bin/hakchi3-${{ env.displayVersion }}-installer.exe
            hakchi3-${{ env.displayVersion }}-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}